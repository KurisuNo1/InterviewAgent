server:
  host: "0.0.0.0"
  port: 8080
  ws_path: "/ws"
  read_timeout: 30s
  jwt_secret: "${JWT_SECRET:-interview-agent-secret-key}"
  jwt_expiry: 24h
  write_timeout: 60s

llm:
  provider: "qwen"
  base_url: "https://api.deepseek.com/v1"
  api_key_env: "DEEPSEEK_API_KEY"
  model: "deepseek-chat"
  temperature: 0.7
  max_tokens: 4096
  timeout: 60s
  max_retries: 3

embedding:
  provider: "qwen"
  base_url: "https://api-inference.modelscope.cn/v1" 
  api_key_env: "DASHSCOPE_API_KEY"
  model: "Qwen/Qwen3-Embedding-0.6B" 
  dimensions: 1024
  timeout: 30s

vector_db:
  type: "milvus"
  host: "localhost"
  port: 19530
  username: "root"
  password: "Milvus"
  database: "default"
  collection: "interview_question_bank"
  dimension: 1024
  index_type: "IVF_FLAT"
  metric_type: "IP"

keyword_index:
  type: "bleve"
  index_path: "./data/bleve_index"

mcp:
  connection_timeout: 30s
  servers:
    - name: "github"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
    - name: "web_search"
      command: "npx"
      args: ["-y", "freesearch-mcpserver"]

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

mysql:
  host: "localhost"
  port: 3307
  user: "root"
  password_env: "MYSQL_ROOT_PASSWORD"
  database: "interview_agent"
  charset: "utf8mb4"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: "5m"

interview:
  max_questions: 10
  max_follow_ups: 3
  time_per_question: 300
  checkpoint_ttl: 3600s
  difficulty_up_threshold: 2
  difficulty_down_threshold: 2
  scoring_dimensions:
    - name: "technical_accuracy"
      weight: 0.40
      description: "技术准确性"
      max_score: 10
    - name: "answer_depth"
      weight: 0.25
      description: "回答深度"
      max_score: 10
    - name: "communication"
      weight: 0.20
      description: "沟通表达"
      max_score: 10
    - name: "project_experience"
      weight: 0.15
      description: "项目经验匹配度"
      max_score: 10

rag:
  vector_weight: 0.7
  keyword_weight: 0.3
  top_k: 10
  final_top_k: 5

memory:
  short_term:
    max_messages: 30
    ttl: 7200s
  long_term:
    max_history: 50

context:
  max_tokens: 32768
  profiles:
    casual_chat:
      system_max: 1024
      working_memory: 24576
      rag_max: 4096
      recent_verbatim_turns: 3
      history_max_turns: 20
      compression_threshold_turns: 12
    interview_ask:
      system_max: 2048
      working_memory: 16384
      rag_max: 4096
      recent_verbatim_turns: 3
      history_max_turns: 8
      compression_threshold_turns: 8
    interview_eval:
      system_max: 3072
      working_memory: 8192
      rag_max: 4096
      recent_verbatim_turns: 3
      history_max_turns: 6
      compression_threshold_turns: 6
    skill:
      system_max: 2048
      working_memory: 20480
      rag_max: 4096
      recent_verbatim_turns: 3
      history_max_turns: 12
      compression_threshold_turns: 10
    stream_fallback:
      system_max: 1024
      working_memory: 24576
      rag_max: 4096
      recent_verbatim_turns: 3
      history_max_turns: 20
      compression_threshold_turns: 12
    stream_agent:
      system_max: 1024
      working_memory: 24576
      rag_max: 4096
      recent_verbatim_turns: 3
      history_max_turns: 20
      compression_threshold_turns: 12

skills:
  - name: "algorithm"
    sub_intent: "algorithm"
    enabled: true
  - name: "system_design"
    sub_intent: "system_design"
    enabled: true
  - name: "behavioral"
    sub_intent: "behavioral"
    enabled: true
  - name: "tech_quiz"
    sub_intent: "tech_quiz"
    enabled: true

logging:
  level: "info"
  format: "json"
  output: "stdout"
  file_path: "./logs/interview_agent.log"

upload:
  max_file_size: 10485760  # 10 MB
  chunk_size: 1000
  chunk_overlap: 200

wechat:
  app_id: "${WECHAT_APPID}"
  app_secret: "${WECHAT_APPSECRET}"

