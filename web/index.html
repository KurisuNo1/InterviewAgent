<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterviewAgent - AI模拟面试官</title>
<link rel="stylesheet" href="/web/css/style.css">
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button id="btn-new-chat" class="btn-new-chat">+ 新对话</button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-mode="chat"><span class="nav-icon">&#x1F4AC;</span> AI 闲聊</div>
      <div class="nav-item" data-mode="interview"><span class="nav-icon">&#x1F3A4;</span> 模拟面试</div>
      <div class="nav-item" data-mode="skills"><span class="nav-icon">&#x1F4DA;</span> 技能练习</div>
      <div class="nav-item" data-mode="knowledge"><span class="nav-icon">&#x1F4C1;</span> 知识库</div>
    </nav>
    <div class="sidebar-history" id="sidebar-history">
      <div class="history-title">对话历史</div>
      <div id="history-list"></div>
    </div>
    <div class="sidebar-recent" id="sidebar-recent" style="display:none">
      <div class="history-title">最近消息</div>
      <div id="recent-list"></div>
    </div>
    <div class="sidebar-footer">
      <div class="user-info" id="user-info">
        <span id="username-display">未登录</span>
        <button id="btn-login" class="btn-sm">登录</button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main id="main">
    <!-- Chat Mode -->
    <div id="mode-chat" class="mode-content active">
      <div id="chat-header" class="chat-header">
        <button id="btn-toggle-sidebar" class="btn-icon">&#x2630;</button>
        <span class="chat-title" id="chat-title">AI 闲聊</span>
        <button id="btn-clear-chat" class="btn-sm">清空</button>
      </div>
      <div class="chat-layout">
        <div class="chat-main">
          <div id="chat-box" class="chat-box">
            <div class="welcome-msg">
              <h2>InterviewAgent</h2>
              <p>我是你的 AI 面试助手。可以闲聊、模拟面试、练习技能。试试问我问题吧！</p>
            </div>
          </div>
          <div id="chat-input-area" class="chat-input-area">
            <textarea id="input-msg" placeholder="输入消息...（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
            <button id="btn-send" class="btn-send">&#x27A4;</button>
            <div class="btn-debug-wrap">
              <button id="btn-debug-panel" class="btn-sm btn-debug" title="上下文用量 & 工具">&#x26A1;</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Interview Mode -->
    <div id="mode-interview" class="mode-content">
      <div class="chat-header">
        <button id="btn-toggle-sidebar-2" class="btn-icon">&#x2630;</button>
        <span class="chat-title">模拟面试</span>
        <button id="btn-end-interview-header" class="btn-sm" style="color:var(--danger);border-color:var(--danger);display:none" title="结束面试并生成报告">&#x23F9; 结束面试</button>
      </div>
      <!-- Step Progress Bar -->
      <div class="interview-progress">
        <div class="progress-step active" data-step="jd"><span class="step-num">1</span><span class="step-label">岗位描述</span></div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="resume"><span class="step-num">2</span><span class="step-label">简历上传</span></div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="interviewing"><span class="step-num">3</span><span class="step-label">模拟面试</span></div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="report"><span class="step-num">4</span><span class="step-label">面试报告</span></div>
      </div>
      <div class="interview-layout">
        <div id="interview-content" class="interview-main"></div>
        <div id="interview-sidebar" class="interview-sidebar" style="display:none">
          <div class="sidebar-panel">
            <h4>&#x1F4CA; 面试记录</h4>
            <div id="interview-history-list"></div>
          </div>
          <div id="current-result-panel" class="sidebar-panel" style="display:none">
            <h4>&#x1F3AF; 当前结果</h4>
            <div id="current-result-content"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Skills Mode -->
    <div id="mode-skills" class="mode-content">
      <div class="chat-header">
        <button id="btn-toggle-sidebar-3" class="btn-icon">&#x2630;</button>
        <span class="chat-title">技能练习</span>
      </div>
      <div id="skills-content" class="skills-content"></div>
    </div>

    <!-- Knowledge Mode -->
    <div id="mode-knowledge" class="mode-content">
      <div class="chat-header">
        <button id="btn-toggle-sidebar-4" class="btn-icon">&#x2630;</button>
        <span class="chat-title">知识库</span>
      </div>
      <div id="knowledge-content" class="knowledge-content"></div>
    </div>
  </main>
</div>

<!-- History Modal -->
<div id="history-modal" class="modal" style="display:none">
  <div class="modal-content" style="width:520px;max-height:70vh;overflow-y:auto">
    <h3>&#x1F4CA; 历史面试记录</h3>
    <div id="history-modal-list"></div>
    <div class="modal-btns" style="margin-top:16px">
      <button id="btn-history-close" class="btn btn-secondary">关闭</button>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div id="login-modal" class="modal" style="display:none">
  <div class="modal-content">
    <h3 id="login-title">登录</h3>
    <input id="login-username" placeholder="用户名" autocomplete="username">
    <input id="login-password" type="password" placeholder="密码" autocomplete="current-password">
    <div class="modal-btns">
      <button id="btn-login-submit" class="btn btn-primary">登录</button>
      <button id="btn-register-submit" class="btn btn-secondary">注册</button>
      <button id="btn-login-cancel" class="btn btn-secondary">取消</button>
    </div>
    <div id="login-msg" class="login-msg"></div>
    <div class="login-hint">测试账号: demo / demo123</div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script src="/web/js/app.js"></script>
</body>
</html>
